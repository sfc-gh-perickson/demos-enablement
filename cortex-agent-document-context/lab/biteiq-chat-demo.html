<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiteIQ - Document Context Demo</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e4e7ef; height: 100vh; display: flex; flex-direction: column; }
    .header { padding: 1rem 1.5rem; border-bottom: 1px solid #2e3345; background: #1a1d27; display: flex; align-items: center; gap: 1rem; }
    .header h1 { font-size: 1.1rem; font-weight: 600; }
    .header .badge { background: rgba(41,181,246,0.15); color: #29b5f6; padding: 0.2rem 0.6rem; border-radius: 99px; font-size: 0.7rem; }
    .config-bar { padding: 0.75rem 1.5rem; background: #1a1d27; border-bottom: 1px solid #2e3345; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    .config-bar label { font-size: 0.8rem; color: #8b92a8; }
    .config-bar input { background: #0f1117; border: 1px solid #2e3345; color: #e4e7ef; padding: 0.4rem 0.6rem; border-radius: 4px; font-size: 0.8rem; flex: 1; min-width: 200px; }
    .config-bar button { background: #29b5f6; color: #fff; border: none; padding: 0.4rem 0.8rem; border-radius: 4px; font-size: 0.8rem; cursor: pointer; }
    .config-bar button:hover { background: #0ea5e9; }
    .messages { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .message { max-width: 80%; padding: 0.75rem 1rem; border-radius: 12px; font-size: 0.9rem; line-height: 1.5; white-space: pre-wrap; }
    .message.user { align-self: flex-end; background: #29b5f6; color: #fff; border-bottom-right-radius: 4px; }
    .message.assistant { align-self: flex-start; background: #1a1d27; border: 1px solid #2e3345; border-bottom-left-radius: 4px; }
    .message.system { align-self: center; background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.3); color: #a78bfa; font-size: 0.8rem; max-width: 90%; text-align: center; }
    .message .tool-tag { display: inline-block; background: rgba(41,181,246,0.1); color: #29b5f6; padding: 0.1rem 0.4rem; border-radius: 3px; font-size: 0.75rem; margin-bottom: 0.25rem; }
    .input-area { padding: 1rem 1.5rem; border-top: 1px solid #2e3345; background: #1a1d27; display: flex; gap: 0.75rem; align-items: flex-end; }
    .input-area textarea { flex: 1; background: #0f1117; border: 1px solid #2e3345; color: #e4e7ef; padding: 0.6rem 0.8rem; border-radius: 8px; font-size: 0.9rem; resize: none; min-height: 42px; max-height: 120px; font-family: inherit; }
    .input-area textarea:focus { outline: none; border-color: #29b5f6; }
    .input-area .file-btn { background: none; border: 1px solid #2e3345; color: #8b92a8; padding: 0.5rem; border-radius: 8px; cursor: pointer; display: flex; align-items: center; }
    .input-area .file-btn:hover { border-color: #29b5f6; color: #29b5f6; }
    .input-area .file-btn.has-file { border-color: #10b981; color: #10b981; }
    .input-area .send-btn { background: #29b5f6; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
    .input-area .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .file-preview { padding: 0.5rem 1.5rem; background: #1a1d27; border-top: 1px solid #2e3345; font-size: 0.8rem; color: #10b981; display: flex; align-items: center; gap: 0.5rem; }
    .file-preview button { background: none; border: none; color: #f44336; cursor: pointer; font-size: 0.9rem; }
    .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid #2e3345; border-top-color: #29b5f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    function App() {
      const [config, setConfig] = useState({
        account: '',
        token: '',
        database: 'DOCUMENT_CONTEXT_LAB',
        schema: 'PUBLIC',
        agent: 'BITEIQ_AGENT',
        backendUrl: 'http://localhost:5001',
      });
      const [configured, setConfigured] = useState(false);
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [file, setFile] = useState(null);
      const [fileContent, setFileContent] = useState(null);
      const [loading, setLoading] = useState(false);
      const [threadId, setThreadId] = useState(null);
      const [parentMsgId, setParentMsgId] = useState(null);
      const messagesEndRef = useRef(null);
      const fileInputRef = useRef(null);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

      const accountUrl = () => `https://${config.account}.snowflakecomputing.com`;

      const agentUrl = () =>
        `${accountUrl()}/api/v2/databases/${config.database}/schemas/${config.schema}/agents/${config.agent}:run`;

      const headers = () => ({
        'Authorization': `Bearer ${config.token}`,
        'Content-Type': 'application/json',
        'Accept': 'application/json',
      });

      const createThread = async () => {
        try {
          const url = `${accountUrl()}/api/v2/cortex/threads`;
          const resp = await fetch(url, { method: 'POST', headers: headers(), body: '{}' });
          const data = await resp.json();
          // Thread ID may be in different fields depending on API version
          const tid = data.thread_id || data.id || (data.metadata && data.metadata.thread_id);
          if (tid) {
            setThreadId(tid);
            setParentMsgId(0);
            return tid;
          }
        } catch (e) {
          console.warn('Thread creation failed, continuing without threads:', e);
        }
        return null;
      };

      const handleFileSelect = (e) => {
        const f = e.target.files[0];
        if (!f) return;
        setFile(f);
        // Read all files as text — works perfectly for text/CSV/JSON.
        // For PDFs it gives garbled content, but we handle that case separately.
        const reader = new FileReader();
        reader.onload = (ev) => setFileContent(ev.target.result);
        reader.readAsText(f);
      };

      const removeFile = () => {
        setFile(null);
        setFileContent(null);
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      const sendMessage = async () => {
        if (!input.trim() && !file) return;
        setLoading(true);

        const userMsg = input.trim();
        setInput('');

        // Show user message in chat
        const displayMessages = [...messages];
        if (file) {
          displayMessages.push({ role: 'system', text: `Attached: ${file.name}` });
        }
        displayMessages.push({ role: 'user', text: userMsg });
        setMessages(displayMessages);

        try {
          // Create thread if needed
          let tid = threadId;
          let pmid = parentMsgId;
          if (!tid) {
            tid = await createThread();
            pmid = 0;
          }

          // File handling: upload via backend which PUTs to stage
          const stagedFiles = [];
          if (file) {
            try {
              const formData = new FormData();
              formData.append('file', file);
              const uploadResp = await fetch(`${config.backendUrl}/upload`, {
                method: 'POST',
                body: formData,
              });
              const uploadData = await uploadResp.json();
              if (uploadData.staged_path) {
                stagedFiles.push(uploadData.staged_path);
              }
            } catch (e) {
              console.warn('Backend upload failed, inlining content:', e);
              // Fallback: inline text content if backend is unavailable
              if (fileContent) {
                stagedFiles.push(null); // signal to use inline below
              }
            }
          }

          // Build content blocks
          const content = [];
          if (stagedFiles.length > 0 && stagedFiles[0]) {
            const fileList = stagedFiles.map(f => `'${f}'`).join(', ');
            content.push({
              type: 'text',
              text: `[The user has uploaded the following files to the document stage: ${fileList}. Use the read_document tool to access them if relevant to the question.]`
            });
          } else if (file && fileContent) {
            // Fallback: inline text content directly
            content.push({
              type: 'text',
              text: `[ATTACHED FILE: ${file.name}]\n${fileContent.substring(0, 15000)}\n[END FILE]`
            });
          }

          content.push({ type: 'text', text: userMsg });

          const body = {
            stream: false,
            messages: [{ role: 'user', content }],
          };

          // Only include thread fields if we have a valid thread
          if (tid) {
            body.thread_id = tid;
            body.parent_message_id = pmid || 0;
          }

          const resp = await fetch(agentUrl(), { method: 'POST', headers: headers(), body: JSON.stringify(body) });
          const data = await resp.json();

          // Update thread state
          const metadata = data.metadata || {};
          if (metadata.assistant_message_id) {
            setParentMsgId(metadata.assistant_message_id);
          }

          // Extract response
          const toolCalls = [];
          let responseText = '';
          for (const block of (data.content || [])) {
            if (block.type === 'tool_use') {
              const tu = block.tool_use || {};
              toolCalls.push(`${tu.name}(${JSON.stringify(tu.input || {}).substring(0, 80)})`);
            } else if (block.type === 'text') {
              responseText += (responseText ? '\n' : '') + (block.text || '');
            }
          }

          const assistantParts = [];
          if (toolCalls.length > 0) {
            assistantParts.push({ role: 'assistant', text: toolCalls.map(t => `[tool] ${t}`).join('\n'), isTool: true });
          }
          if (responseText) {
            assistantParts.push({ role: 'assistant', text: responseText });
          }
          if (!responseText && toolCalls.length === 0) {
            assistantParts.push({ role: 'assistant', text: JSON.stringify(data, null, 2).substring(0, 500) });
          }

          setMessages([...displayMessages, ...assistantParts]);
        } catch (err) {
          setMessages([...displayMessages, { role: 'assistant', text: `Error: ${err.message}` }]);
        }

        removeFile();
        setLoading(false);
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      };

      if (!configured) {
        return (
          <div style={{ display: 'flex', flexDirection: 'column', height: '100vh' }}>
            <div className="header">
              <h1>BiteIQ - Document Context Demo</h1>
              <span className="badge">Configure Connection</span>
            </div>
            <div style={{ padding: '2rem', maxWidth: '500px', margin: '2rem auto' }}>
              <div style={{ marginBottom: '1rem' }}>
                <label style={{ display: 'block', fontSize: '0.8rem', color: '#8b92a8', marginBottom: '0.3rem' }}>Account Identifier (e.g. SFSENORTHAMERICA-PERICKSON_AWS1)</label>
                <input className="config-bar" style={{ width: '100%', background: '#0f1117', border: '1px solid #2e3345', color: '#e4e7ef', padding: '0.5rem', borderRadius: '4px' }}
                  placeholder="ORG-ACCOUNT"
                  value={config.account} onChange={e => setConfig({...config, account: e.target.value.trim()})} />
              </div>
              <div style={{ marginBottom: '1rem' }}>
                <label style={{ display: 'block', fontSize: '0.8rem', color: '#8b92a8', marginBottom: '0.3rem' }}>Session Token or PAT</label>
                <input className="config-bar" type="password" style={{ width: '100%', background: '#0f1117', border: '1px solid #2e3345', color: '#e4e7ef', padding: '0.5rem', borderRadius: '4px' }}
                  value={config.token} onChange={e => setConfig({...config, token: e.target.value})} />
              </div>
              <div style={{ marginBottom: '1rem', display: 'flex', gap: '0.5rem' }}>
                <div style={{ flex: 1 }}>
                  <label style={{ display: 'block', fontSize: '0.8rem', color: '#8b92a8', marginBottom: '0.3rem' }}>Database</label>
                  <input style={{ width: '100%', background: '#0f1117', border: '1px solid #2e3345', color: '#e4e7ef', padding: '0.5rem', borderRadius: '4px' }}
                    value={config.database} onChange={e => setConfig({...config, database: e.target.value})} />
                </div>
                <div style={{ flex: 1 }}>
                  <label style={{ display: 'block', fontSize: '0.8rem', color: '#8b92a8', marginBottom: '0.3rem' }}>Schema</label>
                  <input style={{ width: '100%', background: '#0f1117', border: '1px solid #2e3345', color: '#e4e7ef', padding: '0.5rem', borderRadius: '4px' }}
                    value={config.schema} onChange={e => setConfig({...config, schema: e.target.value})} />
                </div>
                <div style={{ flex: 1 }}>
                  <label style={{ display: 'block', fontSize: '0.8rem', color: '#8b92a8', marginBottom: '0.3rem' }}>Agent</label>
                  <input style={{ width: '100%', background: '#0f1117', border: '1px solid #2e3345', color: '#e4e7ef', padding: '0.5rem', borderRadius: '4px' }}
                    value={config.agent} onChange={e => setConfig({...config, agent: e.target.value})} />
                </div>
              </div>
              <button onClick={() => setConfigured(true)} style={{ width: '100%', background: '#29b5f6', color: '#fff', border: 'none', padding: '0.7rem', borderRadius: '6px', fontSize: '0.9rem', cursor: 'pointer' }}>
                Connect
              </button>
              <p style={{ marginTop: '1rem', fontSize: '0.75rem', color: '#8b92a8' }}>
                Run <code>python backend.py</code> first. The backend handles file uploads to stage.
                Account/token are used for direct agent:run calls (fallback if backend /ask is not used).
              </p>
            </div>
          </div>
        );
      }

      return (
        <div style={{ display: 'flex', flexDirection: 'column', height: '100vh' }}>
          <div className="header">
            <h1>BiteIQ</h1>
            <span className="badge">Document Context Demo</span>
            <span style={{ marginLeft: 'auto', fontSize: '0.75rem', color: '#8b92a8' }}>
              {config.database}.{config.schema}.{config.agent}
              {threadId && ` | Thread: ${threadId}`}
            </span>
            <button onClick={() => { setThreadId(null); setParentMsgId(null); setMessages([]); }}
              style={{ background: 'none', border: '1px solid #2e3345', color: '#8b92a8', padding: '0.3rem 0.6rem', borderRadius: '4px', cursor: 'pointer', fontSize: '0.75rem' }}>
              New Chat
            </button>
          </div>

          <div className="messages">
            {messages.length === 0 && (
              <div style={{ textAlign: 'center', color: '#8b92a8', marginTop: '4rem' }}>
                <p style={{ fontSize: '1.1rem', marginBottom: '0.5rem' }}>Ask BiteIQ a question</p>
                <p style={{ fontSize: '0.85rem' }}>Attach a file with the + button to provide document context</p>
              </div>
            )}
            {messages.map((msg, i) => (
              <div key={i} className={`message ${msg.role}`}>
                {msg.isTool && <div className="tool-tag">Tools Used</div>}
                {msg.isTool ? <div style={{ fontFamily: 'monospace', fontSize: '0.8rem' }}>{msg.text}</div> : msg.text}
              </div>
            ))}
            {loading && <div className="message assistant"><span className="loading"></span></div>}
            <div ref={messagesEndRef} />
          </div>

          {file && (
            <div className="file-preview">
              <span>Attached: {file.name} ({(file.size / 1024).toFixed(1)} KB)</span>
              <button onClick={removeFile}>x</button>
            </div>
          )}

          <div className="input-area">
            <input type="file" ref={fileInputRef} onChange={handleFileSelect} style={{ display: 'none' }}
              accept=".pdf,.docx,.pptx,.txt,.html,.csv,.json,.md,.png,.jpg,.jpeg" />
            <button className={`file-btn ${file ? 'has-file' : ''}`} onClick={() => fileInputRef.current?.click()} title="Attach file">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M12 5v14M5 12h14"/>
              </svg>
            </button>
            <textarea
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={handleKeyDown}
              placeholder="Ask about store performance, or attach a document..."
              rows={1}
            />
            <button className="send-btn" onClick={sendMessage} disabled={loading || (!input.trim() && !file)}>
              Send
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
